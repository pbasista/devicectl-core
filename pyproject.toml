[project]
name = "devicectl-core"
dynamic = ["version"]
description = "Shared building blocks for single-device control programs: a subcommand table, a serialising worker, an SSE broadcaster, and a build-free browser UI."
readme = "README.md"
license = "EUPL-1.2"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Peter Bašista", email = "pbasista@gmail.com" }]
requires-python = ">=3.10"
# Deliberately none.  Everything here is standard library, so a program that
# depends on this package pays for its own protocol layer and nothing else --
# and the package stays installable on a Raspberry Pi.
dependencies = []
keywords = [
    "cli",
    "device",
    "embedded",
    "framework",
    "preact",
    "server-sent-events",
    "web-ui",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/pbasista/devicectl-core"
Repository = "https://github.com/pbasista/devicectl-core"
Issues = "https://github.com/pbasista/devicectl-core/issues"
Releases = "https://github.com/pbasista/devicectl-core/releases"
License = "https://github.com/pbasista/devicectl-core/blob/main/LICENSE"

[dependency-groups]
# `uv run` and `uv sync` install this group by default, so anything in it is
# installed by merely *using* the package from a checkout.  It stays small and
# pure Python for that reason.
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
    "ty>=0.0.1a21",
]

# The checks that need a real engine rather than a parser of our own.  Opt in
# with `uv sync --group browser`, which is what CI does; the checks and their
# tests skip themselves, saying so, when the engine is absent.
#
#   * mini-racer is an embedded V8 that devtools/htmcheck.py runs the vendored
#     preact-htm bundle in, so every `html` template is parsed by the same code
#     the browser will parse it with.  It is ~80 MB and publishes no armv7
#     wheel.
#   * playwright drives the headless Chromium the render checks draw a page in.
#     The browser itself is a further download:
#     `uv run --group browser python -m playwright install chromium`.
browser = [
    "mini-racer>=0.12",
    "playwright>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/devicectl/__init__.py"

# Naming the package sweeps web/static/** into the wheel with it, so the
# frontend needs no package-data globs of its own.
[tool.hatch.build.targets.wheel]
packages = ["src/devicectl"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
# Pydocstyle (D, PEP 257) keeps docstrings honest; PLR2004 flags magic numbers,
# so protocol values end up in named constants.  BLE001 makes `except
# Exception` say why it is right -- a narrow rule from a wider family we do not
# select -- and RUF100 is what keeps a suppression from outliving the rule it
# names.  C901 and PLR0912 are the guard against a function growing back into
# several: at the default thresholds, every one they flagged turned out to be
# two or three simple things sharing a body.
select = ["E", "F", "W", "D", "I", "BLE001", "C901", "PLR0912", "PLR2004", "RUF100"]
# The formatter keeps code within 88 columns, but we do not enforce E501 on
# comments/docstrings/strings -- the formatter never breaks those.
ignore = ["E501"]

[tool.ruff.lint.isort]
# An import that renames one of its names is still one import; without this,
# isort splits every aliased name out into a second import of the same module.
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Tests need no docstrings and naturally use literal fixture values.
"tests/**" = ["D", "PLR2004"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["src"]

[tool.ty.rules]
# `py_mini_racer` is in the `browser` group, so whether the checker can see
# it depends on whether that group happens to be synced.  The suppression on
# its import has to be there for the checkout that has not synced it, and is
# then "unused" in the one that has: the same file cannot be right both ways.
unused-ignore-comment = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # the engine's ctypes structs predate Python 3.14's _layout_ warnings
    "ignore:Due to '_pack_':DeprecationWarning:py_mini_racer",
]
